# 最小可部署拓扑：web (Next.js) + api (FastAPI)
# 一键启动：  docker compose up --build
# 访问：      前端 http://localhost:3000   后端 http://localhost:8000/health
#
# 后端密钥：把 Gemini Key 放在 api/.env（已被 .gitignore 忽略，不会提交）。
#           没有 .env 时后端自动走 mock（回显输入图），链路仍可跑通。

services:
  api:
    build: ./api
    env_file:
      - path: ./api/.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      # 生成的图片与日志持久化，容器重启不丢
      - api_storage:/app/storage
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # 构建期内联到前端；改公网域名后需重新 build
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_storage:
  api_data:
